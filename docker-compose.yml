version: '3.8'

services:
  # 1. Database PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: itinerary_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d itinerary_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend API (FastAPI)
  backend:
    build: ./backend
    # Menjalankan FastAPI dengan mode reload
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Sinkronisasi kode real-time
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/itinerary_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Background Worker (RQ)
  worker:
    build: ./backend
    # Menjalankan Redis Queue worker
    command: rq worker --url redis://redis:6379/0 high default low
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/itinerary_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=AIzaSyBgbxB9YlqG-gp9vAL0Ryj8Pe-W-DWK4Sg
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # 5. Frontend (Next.js)
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Mencegah bentrok node_modules lokal dan docker
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data: